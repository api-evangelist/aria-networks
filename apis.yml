aid: aria-networks
name: Aria Networks
description: 'Aria Networks, Inc. is a Palo Alto, California networking company founded
  in 2025 by Mansour Karam (founder and former CEO of Apstra, acquired by Juniper Networks
  in 2020) that builds "Deep Networking" — an AI-native networking system for AI factories
  and GPU data centers. The platform pairs purpose-built 800GbE and 1.6Tbps Ethernet
  switches on Broadcom Tomahawk 5 and Tomahawk 6 silicon running a hardened SONiC network
  OS with microsecond-resolution telemetry agents on switch ASICs, switch-OS kernels,
  transceivers, server NICs and GPU clusters, plus a reasoning layer that detects, root-causes
  and resolves fabric issues. Aria measures itself on Model FLOPS Utilization (MFU) and
  token efficiency rather than traditional network metrics. The company disclosed $125M
  in funding from Sutter Hill Ventures, Atreides Management, Valor Equity Partners and
  Eclipse Ventures in April 2026. A production REST API is live at api.arianetworks.com
  (Aria API 1.0.0), but its reference documentation and machine-readable specification
  sit behind a customer login.'
