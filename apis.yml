apis:
- name: Aria API
  description: 'The Aria API is the REST control surface for the Aria Networks Deep Networking
    platform. Its unauthenticated root index at https://api.arianetworks.com/ advertises
    version 1.0.0 and sixteen resource groups — health, admin, alerts, api-keys, auth,
    cli, controllers, devices, fabrics, fabric config, metrics, members, releases, sites,
    support and webhooks — under a /v1 path prefix. Only /v1/health answers anonymously;
    every other resource returns HTTP 401 with a JSON error envelope. The root index
    reports "docs": null and the doc_url in every error response points at
    https://api.arianetworks.com/reference, which is not published (404).'
  humanURL: https://arianetworks.com/product
