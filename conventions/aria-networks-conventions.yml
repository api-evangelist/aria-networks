  current: v1
  api_version: 1.0.0
  evidence: >-
    https://api.arianetworks.com/ reports {"name":"Aria API","version":"1.0.0"} and
    every advertised resource is prefixed /v1. No Accept-header or custom
    version-header negotiation was observed.
request_tracing:
  header: x-request-id
  body_field: request_id
  server_generated: true
  client_supplied: unknown
  evidence: >-
    Every response — 200, 401 and 404 under /v1 — carries an x-request-id response
    header, and JSON error bodies repeat the same value in a request_id field. It
    could not be determined anonymously whether a client-supplied x-request-id is
    honoured.
error_envelope:
  shape: vendor
  fields: [type, code, message, param, request_id, doc_url]
  rfc9457: false
  see: errors/aria-networks-problem-types.yml
idempotency:
  supported: unknown
  evidence: >-
    No Idempotency-Key handling could be observed. The API does not advertise an
    idempotency header, the CORS preflight on /v1/fabrics allows only Content-Type
    and Authorization request headers (an Idempotency-Key request header would be
    rejected by that policy as configured), and no public documentation exists to
    confirm or deny support. NOT claimed.
pagination:
