source: https://api.arianetworks.com/
note: >-
  Aria Networks publishes no OpenAPI, no public API reference and no developer
  guide — docs.arianetworks.com 302-redirects every path to /login. Everything
  below was observed directly against the live API by an anonymous caller. Where a
  convention could not be observed, it is recorded as unknown rather than assumed.
