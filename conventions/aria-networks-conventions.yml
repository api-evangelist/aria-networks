x-gaps:
  note: >-
    Recorded for the provider, not scored against them. These are the specific,
    cheap fixes that would make the Aria API legible to an integrator or an agent.
  items:
  - >-
    Every error response points at https://api.arianetworks.com/reference, which
    returns 404. Publishing that reference — or changing doc_url — is a one-line
    fix that currently sends every failing developer to a dead page.
  - >-
    The root index reports "docs": null. Pointing it at a public OpenAPI would make
    the whole surface machine-discoverable without opening any data.
  - >-
    docs.arianetworks.com is a Mintlify site with login on every path, including
    /llms.txt and /docs.json. Mintlify serves both publicly by default; the login
    wall is what removes Aria from agent-readable discovery.
  - >-
    No WWW-Authenticate header on 401, so the bearer/JWT scheme is only discoverable
    by sending a deliberately malformed credential.
  - >-
    A /v1/webhooks resource exists but no event catalog is published, so no AsyncAPI
    or webhook contract could be captured.
