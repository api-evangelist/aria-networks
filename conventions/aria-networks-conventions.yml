  evidence: >-
    Every collection resource is 401-gated, so no list response could be observed.
rate_limiting:
  headers_observed: []
  evidence: >-
    No RateLimit-*, X-RateLimit-* or Retry-After headers were returned on any
    anonymous request, including repeated calls to /v1/health.
cors:
