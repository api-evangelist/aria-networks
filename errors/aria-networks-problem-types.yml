source: https://api.arianetworks.com/v1/
format: vendor-envelope
format_note: >-
  NOT RFC 9457. The Aria API returns application/json (never
  application/problem+json) with a Stripe-flavored error envelope. There is no
  "type" URI — the "type" field carries a short error class string, not a
  dereferenceable URI, so RFC 9457 tooling will not resolve it.
envelope:
  content_type: application/json
  fields:
  - name: type
    description: Error class string. Only "invalid_request_error" was observed anonymously.
  - name: code
    description: Machine-readable error code. Null on every anonymous response observed.
  - name: message
    description: Human-readable message.
  - name: param
    description: Offending request parameter. Null on every anonymous response observed.
  - name: request_id
    description: >-
      Per-request correlation id, mirrored in the x-request-id response header on
      every response including 200s.
  - name: doc_url
    description: >-
      Deep link into the API reference, of the form
      https://api.arianetworks.com/reference#tag/<tag>/<METHOD>/<path>. The target
      is NOT published — https://api.arianetworks.com/reference returns HTTP 404 —
      so every error the API emits points a developer or agent at a dead page.
  example: |
    {
      "type": "invalid_request_error",
      "code": null,
      "message": "Authentication required",
      "param": null,
      "request_id": "756eb08c-e800-498d-a866-5a4cdbfd81e9",
      "doc_url": "https://api.arianetworks.com/reference#tag/fabrics/GET/v1/fabrics"
    }
